services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innerscript
      POSTGRES_PASSWORD: innerscript
      POSTGRES_DB: innerscript
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerscript -d innerscript"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innerscript
      POSTGRES_PASSWORD: innerscript
      POSTGRES_DB: innerscript_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerscript -d innerscript_test"]
      interval: 5s
      timeout: 5s
      retries: 10
